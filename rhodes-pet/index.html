<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>罗德岛兔兔桌宠 · 预览</title>
<style>
  html,body{height:100%;margin:0;background:#0b0d12;color:#e8eef7;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
  /* 一层假界面，用来验证桌宠不会挡住底下、也看看叠在真实内容上好不好看 */
  .fake{position:fixed;inset:0;padding:88px;overflow:hidden;
    background:
      radial-gradient(ellipse 60% 50% at 22% 12%,rgba(88,140,220,.16),transparent 70%),
      radial-gradient(ellipse 50% 40% at 82% 82%,rgba(150,90,220,.12),transparent 70%),
      #0b0d12}
  .fake h1{font-size:30px;font-weight:600;letter-spacing:.02em;margin:0 0 10px}
  .fake p{color:rgba(232,238,247,.5);line-height:1.9;max-width:620px;font-size:14px}
  .fake .card{margin-top:26px;padding:18px 20px;border:1px solid rgba(255,255,255,.09);
    border-radius:12px;background:rgba(255,255,255,.03);max-width:620px}
  .fake .card b{color:#9fd8ff;font-weight:500}
  .fake .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .fake button{padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.04);color:#e8eef7;font-size:13px;cursor:pointer;font-family:inherit}
  .fake button:hover{background:rgba(255,255,255,.1)}
  .fake textarea{width:100%;margin-top:18px;height:120px;padding:12px;border-radius:10px;
    border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.35);color:#cfe0f5;
    font-family:Consolas,Menlo,monospace;font-size:13px;resize:none;box-sizing:border-box}
  .tip{position:fixed;left:88px;bottom:36px;font-size:12px;color:rgba(232,238,247,.3);
    font-family:Consolas,Menlo,monospace;letter-spacing:.08em}
</style>
</head>
<body>

<!-- 假界面：只是个背景板，验证遮挡与观感 -->
<div class="fake">
  <h1>罗德岛终端 · 预览页</h1>
  <p>这一页是给桌宠当背景用的。兔兔应该浮在它上面，并且<strong>只有兔兔本体</strong>能接住点击——
     点旁边的文字、按钮、输入框都要正常工作，不能被透明的浮层吃掉。</p>
  <div class="card">
    <div>下面这些是<b>真实可交互</b>的控件，用来验证桌宠没挡住界面：</div>
    <div class="row">
      <button onclick="this.textContent='点到了 ✓'">点我试试</button>
      <button onclick="alert('按钮可用，浮层没有吃事件')">弹窗</button>
      <button onclick="RHODES_PET.openPanel()">打开兔兔设置</button>
      <button onclick="RHODES_PET.feed()">喂一根胡萝卜</button>
      <button onclick="RHODES_PET.talk()">让它说话</button>
      <button onclick="RHODES_PET.grantXp(5)">+5 经验（试升级）</button>
      <button onclick="pokeN(3)">戳它三下</button>
      <button onclick="pokeN(RHODES_PET.angerThreshold)">戳到它生气</button>
    </div>
    <textarea placeholder="在这里打字，确认输入框可以正常聚焦和输入…"></textarea>
  </div>
</div>
<div class="tip">拖动兔兔换位置 · 单击=摸它 · 双击=说话 · 一直戳会生气（眼泪是真的画出来的）· 右键=设置 · Esc 关面板</div>

<script>
/* 假界面上的这两个按钮：戳 N 下（戳太多它会生气，见 pet.js 的 ANGER 段）。
   「戳到它生气」那个按钮按的是一下数不差地读到阈值（angerThreshold），
   不写死数字 —— 阈值改了按钮不用跟着改。 */
function pokeN(n) { for (var i = 0; i < n; i++) window.RHODES_PET.poke(); }
</script>

<script>
/* 把运行期异常暴露到 <title>，这样无头 --dump-dom 就能直接看到脚本挂在哪 */
window.addEventListener('error', function (e) {
  document.title = 'JSERR: ' + (e.message || '') + ' @' + (e.lineno || '?');
});
</script>
<script>
/* ?probe=sound 专用：把 AudioContext 换成假的，记录"到底有没有发声、发的是什么音"。
   必须在 pet.js **之前**执行 —— 引擎一加载就会创建 Sfx 并抓住 AudioContext。 */
(function () {
  if (new URLSearchParams(location.search).get('probe') !== 'sound') return;
  function noop() {}
  var A = window.__AUDIO = { ctx: 0, osc: 0, src: 0, freqs: [] };
  function MockAC() {
    A.ctx++;
    this.currentTime = 0;
    this.sampleRate = 44100;
    this.state = 'running';
    this.destination = {};
    this.resume = noop;
    this.close = noop;
    this.createGain = function () {
      return {
        gain: { value: 0, setValueAtTime: noop, linearRampToValueAtTime: noop,
                exponentialRampToValueAtTime: noop },
        connect: noop, disconnect: noop
      };
    };
    /* 每个振荡器记下它被设定的频率 —— 后面靠这个认出"响的是哪个音效" */
    this.createOscillator = function () {
      A.osc++;
      var rec = { type: '', set: [], rampTo: [] };
      A.freqs.push(rec);
      return {
        type: '',
        frequency: {
          setValueAtTime: function (v) { rec.set.push(v); },
          exponentialRampToValueAtTime: function (v) { rec.rampTo.push(v); }
        },
        connect: noop, start: noop, stop: noop
      };
    };
    this.createBuffer = function (ch, len) {
      return { getChannelData: function () { return new Float32Array(len); } };
    };
    this.createBufferSource = function () {
      A.src++;
      return { buffer: null, connect: noop, start: noop, stop: noop };
    };
    this.createBiquadFilter = function () {
      return { type: '', frequency: { value: 0 }, Q: { value: 0 }, connect: noop };
    };
  }
  window.AudioContext = MockAC;
  window.webkitAudioContext = MockAC;
})();
</script>
<script src="pet.js"></script>
<script>
/* 观察 .rp-bubble 的出现，抓下所有气泡文字。
   用途：验证"签到提醒是否真的跟着出场弹出来了" —— 只看内部状态不够，
   得看到 DOM 里真出现了那句话。必须在引擎自动挂载之前就开始观察。 */
(function () {
  window.__CHECKIN_BUBBLES = [];
  var scan = function (root) {
    var list = root.querySelectorAll ? root.querySelectorAll('.rp-bubble') : [];
    for (var i = 0; i < list.length; i++) {
      var t = (list[i].textContent || '').trim();
      if (t && window.__CHECKIN_BUBBLES.indexOf(t) < 0) window.__CHECKIN_BUBBLES.push(t);
    }
  };
  var obs = new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      for (var j = 0; j < muts[i].addedNodes.length; j++) {
        var n = muts[i].addedNodes[j];
        if (n.nodeType === 1) scan(n);
      }
    }
    scan(document);
  });
  var start = function () { obs.observe(document.documentElement, { childList: true, subtree: true }); };
  if (document.documentElement) start();
  else document.addEventListener('DOMContentLoaded', start);
})();
</script>
<script>
/* ?diag=1 —— 把兔兔与胡萝卜的视口坐标写进标题，便于无头核对是否真的画在屏幕上 */
if (new URLSearchParams(location.search).get('diag') === '1') {
  setTimeout(function () {
    function box(sel) {
      var n = document.querySelector(sel);
      if (!n) return sel + '=MISSING';
      var r = n.getBoundingClientRect(), cs = getComputedStyle(n);
      return sel + '=[' + [r.left, r.top, r.width, r.height].map(Math.round).join(',') +
        '] op=' + cs.opacity + ' z=' + cs.zIndex;
    }
    document.title = 'DIAG|' + box('.rp-pet') + '|' + box('.rp-carrot') + '|' +
      box('.rp-count') + '|vw=' + innerWidth + 'x' + innerHeight;
  }, 260);
}

/* ?probe=1 —— 验证面板里的动态数字（"已吃 N 根"）是否真的会实时更新。
   注意：只有**累计**这一个口径了，早先的"本次会话"已移除（关掉就归零，看着像掉档）。 */
if (new URLSearchParams(location.search).get('probe') === '1') {
  var L = [];
  var rd = function (id) {
    var n = document.querySelector('#' + id);
    return n ? n.textContent : 'MISSING';
  };
  var snap = function () {
    return '面板已吃=' + rd('rp-eat') + ' config=' + window.RHODES_PET.config.eatCount;
  };
  setTimeout(function () {
    L.push('1) 开面板后 ' + snap());
    window.RHODES_PET.feed();
    setTimeout(function () {
      L.push('2) 喂一根后 ' + snap());
      setTimeout(function () { window.RHODES_PET.feed(); }, 1400);
      setTimeout(function () {
        L.push('3) 再喂一根后 ' + snap());
        document.title = 'PROBE|' + L.join(' | ');
      }, 2700);
    }, 200);
  }, 150);
}

/* ?probe=follow —— 验证"跟着鼠标"：鼠标沿轨迹走，看兔兔是不是在附近随机游走
   判据（这才是"跟随"该有的样子）：
     1) 兔兔确实在动，而且路径不是一条直线（有随机折线）
     2) 始终在光标附近（不远不近）
     3) 只是偶尔碰到光标，不是一直压着（旧版每帧指数平滑会永远黏住）
     4) 不越界
   无头浏览器不持续调度 requestAnimationFrame，所以这里显式喂 dt 推进。 */
if (new URLSearchParams(location.search).get('probe') === 'follow') {
  var F = [];
  var P = window.RHODES_PET;
  var petNode = document.querySelector('.rp-pet');
  var box = function () { return petNode.getBoundingClientRect(); };

  /* 这个探针要**按真实时间**跑，不能一帧一帧地喂假 dt。
     原因：followTick 的"休息"判定用的是 performance.now()，不是传进去的 dt。
     早先的写法是同步跑 600 次 P.step(1/60)，而实测每次 step 的真实时钟推进是 0.0ms ——
     时钟几乎没走，兔兔就一直被判成"还在休息"，10 秒只挪了 174px，
     于是探针报 FAIL（其实逻辑没问题，是探针和被测逻辑用了两个不同的时间源）。
     现在改成 setInterval 分块推进，让真实时钟跟着走，每个 tick 里再喂一步 dt。 */
  var DUR = 10000;        // 观察 10 秒
  var mx = 380, my = 430;
  var near = 0, overlapping = 0, samples = 0;
  var dirs = [], prevX = 0, prevY = 0, travel = 0, start = null;
  var t0 = 0;

  var tick = function () {
    mx += 9;
    if (mx > 1180) { mx = 380; my += 60; if (my > 640) my = 430; }   // 走到头换一行
    window.dispatchEvent(new MouseEvent('mousemove', { clientX: mx, clientY: my, bubbles: true }));
    P.step(1 / 60);

    var r = box();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var d = Math.sqrt((cx - mx) * (cx - mx) + (cy - my) * (cy - my));
    samples++;
    if (d <= 420) near++;
    if (d <= 70) overlapping++;                    // 压在光标上
    if (samples % 20 === 0) dirs.push(Math.round(r.left) + ',' + Math.round(r.top));
    if (samples > 1) travel += Math.abs(r.left - prevX) + Math.abs(r.top - prevY);
    prevX = r.left; prevY = r.top;
    if (r.left < 0 || r.top < 0) F.push('！越界 (' + r.left + ',' + r.top + ')');

    if (performance.now() - t0 >= DUR) {
      clearInterval(timer);
      var last = box();
      F.push('跑了 ' + Math.round(performance.now() - t0) + 'ms / ' + samples + ' 次采样');
      F.push('采样点: ' + dirs.join(' | '));
      F.push('总位移=' + Math.round(travel) + 'px（要 > 300 才算真的在动）');
      F.push('在光标 420px 内的比例=' + Math.round(near / samples * 100) + '%（要 >= 70%）');
      F.push('压在光标上的比例=' + Math.round(overlapping / samples * 100) + '%（要 <= 25%，旧版几乎 100%）');
      F.push('终点 (' + Math.round(last.left) + ',' + Math.round(last.top) + ')');
      var ok = travel > 300 && near / samples >= 0.7 && overlapping / samples <= 0.25 &&
        last.left >= 0 && last.top >= 0;
      F.push('结论: ' + (ok ? 'PASS 在附近游走且不黏着' : 'FAIL'));
      document.title = 'FOLLOWPROBE|' + F.join(' | ');
    }
  };

  var timer = 0;
  setTimeout(function () {
    var p0 = box();
    F.push('起点 (' + Math.round(p0.left) + ',' + Math.round(p0.top) + ') follow=' + P.config.follow);
    prevX = p0.left; prevY = p0.top;
    t0 = performance.now();
    timer = setInterval(tick, 16);
  }, 300);
}

/* ?probe=wander —— 验证"自己溜达"走的是**随机路径**，而不是横着一条直线：
     1) 确实在动（总位移够大）
     2) **纵向也在动** —— 这是"不再是一条水平线"最直接的证据
     3) 路径不是一条直线：记录每段移动方向，方向变化次数 >= 1（一段斜线 + 另一段换个方向）
     4) 有停顿：静止采样占比不小（到了就歇，不是一直匀速挪）
     5) 不越界
     6) **不爬高**：全程待在"锚点 y ± bandY"的活动带里（用户要求"不许爬上去"）
   和 follow 探针一样：无头浏览器不持续调度 requestAnimationFrame，
   所以显式喂 dt（P.step）推进；又因为"休息"用的是 performance.now()，
   所以必须用真实（虚拟快进）时钟分块推进，不能同步空转 600 次。 */
if (new URLSearchParams(location.search).get('probe') === 'wander') {
  var WN = [];
  var WP = window.RHODES_PET;
  var wnode = function () { return document.querySelector('.rp-pet'); };
  var wbox = function () { return wnode().getBoundingClientRect(); };

  var DURW = 45000;                     // 观察 45 秒（一段溜达 3~12 秒 + 歇 2.6~9 秒）
  var wSamples = 0, wTravel = 0, wTravelY = 0, wStill = 0, wOutings = 0, wTurns = 0;
  var wAng = null, wWasMoving = false, wPrevX = 0, wPrevY = 0, wStart = null, wOut = false;
  var wHigh = 0, wBand = 0, wAnchor = 0;
  var wt0 = 0;
  /* 把上一次的配置记下来，跑完恢复（别把探针的开关留给用户） */
  var wSave = { wander: WP.config.wander, follow: WP.config.follow };
  WP.config.follow = false;
  WP.config.wander = true;

  var wtick = function () {
    WP.step(1 / 60);
    var r = wbox();
    var dx = r.left - wPrevX, dy = r.top - wPrevY;
    var moved = Math.abs(dx) + Math.abs(dy);
    wSamples++;
    /* ⚠ 阈值要贴合真实步长：溜达速度 26px/s、每帧喂 1/60s → **每帧只走约 0.43px**。
       第一版把"静止"定在 < 0.5px，于是每一帧都被算成静止、偶尔一帧跨过 0.5px 又算成
       "新的一段"—— 45 秒里数出 130 段、方向变化 0 次，全是探针自己的假象。 */
    if (moved < 0.05) {
      wStill++;
      if (wWasMoving) wWasMoving = false;      // 一段走完了
    } else {
      wTravel += Math.abs(dx); wTravelY += Math.abs(dy);
      if (!wWasMoving) { wWasMoving = true; wOutings++; }
      /* 方向变化：把每次位移的角度记下来，与上一段比较（只在真正移动时比） */
      var ang = Math.atan2(dy, dx);
      if (wAng == null) wAng = ang;
      else {
        var d = Math.abs(ang - wAng);
        if (d > Math.PI) d = 2 * Math.PI - d;
        /* 阈值 25°：同一段直线里逐帧的角度几乎不变，跨段换方向才会超 */
        if (d > 0.44 && moved > 0.25) { wTurns++; wAng = ang; }
      }
    }
    if (r.left < 0 || r.top < 0 || r.right > window.innerWidth || r.bottom > window.innerHeight) wOut = true;
    /* 活动带：比锚点高出的最大值（正数 = 爬出了带子）。留 3px 容差给亚像素 */
    if (wAnchor) wHigh = Math.max(wHigh, wAnchor - r.top);
    wPrevX = r.left; wPrevY = r.top;

    if (performance.now() - wt0 >= DURW) {
      clearInterval(wtimer);
      WP.config.wander = wSave.wander;         // 恢复探针改过的开关
      WP.config.follow = wSave.follow;
      WN.push('跑了 ' + Math.round(performance.now() - wt0) + 'ms / ' + wSamples + ' 次采样');
      WN.push('横向总位移=' + Math.round(wTravel) + 'px  纵向总位移=' + Math.round(wTravelY) +
        'px（纵向要 > 20：这是"不是一条水平线"的证据）');
      WN.push('走动段数=' + wOutings + '  方向变化=' + wTurns + ' 次（要 >= 1）');
      WN.push('静止采样=' + Math.round(wStill / wSamples * 100) + '%（要有停顿，别一直匀速挪）');
      WN.push('越界=' + wOut + '（必须 false）');
      WN.push('最高爬到锚点上方 ' + Math.round(wHigh) + 'px（活动带 ' + wBand +
        'px，必须 <= 带子 + 3px 容差）');
      var inBand = wHigh <= wBand + 3;
      var ok = wTravel > 150 && wTravelY > 20 && wTurns >= 1 && !wOut && inBand &&
        (wStill / wSamples) > 0.15 && wOutings >= 2;
      WN.push('结论: ' + (ok ? 'PASS 二维随机路径 + 有停顿 + 没爬出活动带' : 'FAIL'));
      document.title = 'WANDERPROBE|' + WN.join(' | ');
    }
  };

  var wtimer = 0;
  setTimeout(function () {
    var p0 = wbox();
    /* 把锚点钉死在起点：不然"起点"可能是上一次探针留在 localStorage 里的位置，
       活动带跟着乱跑，断言就没意义了。 */
    WP.state.anchorY = p0.top;
    wAnchor = p0.top;
    wBand = 110;                       // 与 pet.js 的 WANDER.bandY 一致
    WN.push('起点 (' + Math.round(p0.left) + ',' + Math.round(p0.top) + ') wander=' +
      WP.config.wander + ' follow=' + WP.config.follow);
    wPrevX = p0.left; wPrevY = p0.top;
    wt0 = performance.now();
    wtimer = setInterval(wtick, 16);
  }, 300);
}

/* ?probe=name —— 验证"自定义名称"：
     1) 没起名时头顶牌子是收起的
     2) 在面板里输入 + 点「保存」→ 牌子出现、文字就是输入的名字
     3) 牌子在**兔兔头顶之上**、水平居中（不是歪在一边）
     4) 牌子**不在翻转层里**（镜像时字不会反着写）且 pointer-events:none（不挡界面）
     5) 真的写进了存档（localStorage 的 config）
     6) 留空再保存 → 牌子收起、存档里也清掉
   ⚠ 这里用 class / textContent / 几何来断言，**不拿 opacity 当判据**：
     出现用的是 0.22s 过渡，无头环境下过渡不推进，读到 0 是环境问题不是功能问题。 */
if (new URLSearchParams(location.search).get('probe') === 'name') {
  var NM = [];
  setTimeout(function () {
    var P = window.RHODES_PET;
    var pet = document.querySelector('.rp-pet');
    var flip = document.querySelector('.rp-flip');
    var plate = document.querySelector('.rp-name');
    if (!plate) { document.title = 'NAMEPROBE|FAIL 找不到 .rp-name 元素'; return; }
    function cfgNameInStore() {
      try { return JSON.parse(localStorage.getItem('dsh-rhodesPet.config') || '{}').name; }
      catch (e) { return undefined; }
    }
    function geom() {
      var r = pet.getBoundingClientRect(), n = plate.getBoundingClientRect();
      return {
        above: n.bottom <= r.top + 1,
        dx: Math.round((n.left + n.width / 2) - (r.left + r.width / 2))
      };
    }
    function save(v) {
      var input = document.querySelector('#rp-name');
      var btn = document.querySelector('#rp-act-name');
      if (!input || !btn) return false;
      input.value = v;
      btn.click();
      return true;
    }

    P.openPanel();                       // 面板是懒建的，先打开才有输入框
    if (!document.querySelector('#rp-name')) {
      document.title = 'NAMEPROBE|FAIL 面板里没有 #rp-name 输入框';
      return;
    }

    /* 先清空一次：预览域名的 localStorage 里可能留着上一次探针存的名字 */
    save('');
    var emptyOff = !pet.classList.contains('rp-hasname') && plate.textContent === '';
    NM.push('① 空名字：牌子收起=' + emptyOff + '（class=' + pet.className +
      '，实际 opacity=' + getComputedStyle(plate).opacity + '）');

    var NAME = '罗德岛兔兔';
    var typed = save(NAME);
    var g = geom();
    var shown = pet.classList.contains('rp-hasname') && plate.textContent === NAME;
    NM.push('② 输入「' + NAME + '」并保存：显示=' + shown +

    var stored = cfgNameInStore();

    save('');
    var cleared = !pet.classList.contains('rp-hasname') && cfgNameInStore() === '';
    NM.push('⑥ 留空再保存：牌子收起=' + cleared);

    var ok = emptyOff && typed && shown && g.above && Math.abs(g.dx) <= 2 && flipOk &&

/* ?probe=dragdrop —— 验证"拖动松手时有一记落地"：
   合成一次拖动（位移超过 4px 才算拖动），松手后采样，应当出现一小段落差再归位。 */
if (new URLSearchParams(location.search).get('probe') === 'dragdrop') {
  var DD = [];
  var PD = window.RHODES_PET;
  var dnode = function () { return document.querySelector('.rp-pet'); };
  setTimeout(function () {
    var r0 = dnode().getBoundingClientRect();
    var dcx = r0.left + r0.width / 2, dcy = r0.top + r0.height / 2;
    var pev = function (type, x, y) {
      dnode().dispatchEvent(new PointerEvent(type, {
        clientX: x, clientY: y, bubbles: true, cancelable: true,
        pointerId: 9, pointerType: 'mouse', isPrimary: true
      }));
    };
    var restTop = Math.round(r0.top);

    /* 按住 → 往上拖 60px（超过 4px 阈值）→ 松手 */
    pev('pointerdown', dcx, dcy);
    DD.push('pointerdown 后 S.drag=' + (PD.state.drag ? '已建立(id=' + PD.state.drag.id + ')' : 'null'));
    /* 事件到底打在了哪个元素上 */
    var hit = document.elementFromPoint(dcx, dcy);
    DD.push('该坐标上的元素=' + (hit ? (hit.className || hit.tagName) : 'null') +
      ' 在 .rp-pet 内=' + !!(hit && hit.closest && hit.closest('.rp-pet')));
    pev('pointermove', dcx, dcy - 60);
    pev('pointermove', dcx, dcy - 60);
    var dropTop = Math.round(dnode().getBoundingClientRect().top);

    pev('pointerup', dcx, dcy - 60);

    var samples = [];
    var t0 = performance.now();
    var tick = function () {
      samples.push(Math.round(dnode().getBoundingClientRect().top));
      if (performance.now() - t0 < 600) { setTimeout(tick, 25); return; }
      var minTop = Math.min.apply(null, samples);
      var last = samples[samples.length - 1];
      DD.push('拖动前 top=' + restTop + ' → 拖完 top=' + dropTop +
        '（应小 60 左右，说明拖动生效）');
      DD.push('松手后采样=' + samples.slice(0, 14).join(','));
      DD.push('过程最高 top=' + minTop + '（松手那一刻）→ 结束 top=' + last);
      var moved = dropTop < restTop - 40;
      var dropped = last > minTop;                 // 确实往下落了一段
      var back = Math.abs(last - dropTop) <= 2;    // 精确归位到落点
      var pass = moved && dropped && back;
      DD.push('结论: ' + (pass ? 'PASS 松手有一记落地并归位'
        : 'FAIL ' + JSON.stringify({ 拖动生效: moved, 有下落: dropped, 精确归位: back })));
      document.title = 'DRAGDROP|' + DD.join(' | ');
    };
    tick();
  }, 900);
}

/* ?probe=levels —— 验证 120 级经验曲线、称号阈值、进度条百分比 */
if (new URLSearchParams(location.search).get('probe') === 'levels') {

    /* 关键累计点。注意 CUM[i] 是"到达 i+1 级"的累计门槛：
       CUM[1]=3 → Lv2，CUM[2]=8 → Lv3，CUM[9]=120 → Lv11，
       所以 Lv10 在 CUM[8]=99，Lv20 在 CUM[18]=?（下面用 439/440 卡 Lv20/Lv21 的边界）。 */
    var key = [
      [0, 1], [2, 1], [3, 2], [7, 2], [8, 3],
      [99, 10], [119, 10], [120, 11], [439, 20], [440, 21],
      [2134, 50], [2135, 51], [9589, 120], [9590, 120], [99999, 120]
    ];
    var bad = 0;
    key.forEach(function (k) {
      var got = lv(k[0]).level;
      var ok = got === k[1];
      if (!ok) bad++;
      LV.push('xp=' + k[0] + ' → Lv' + got + (ok ? '' : '（期望 Lv' + k[1] + '）'));
    });
    /* 称号阈值：现在是**每 20 级一档**（和颜色对齐），所以期望值要按新档位写 */
    var titles = [[1, '临时登记'], [20, '临时登记'], [21, '后勤实习生'],
      [41, '正式干员 · E0'], [61, '资深干员 · E1'], [81, '行动组队长 · E1'],
      [101, '罗德岛王牌 · E2'], [120, '首席胡萝卜官']];
    titles.forEach(function (t) {
      var got = P.titleOf(t[0]);
      LV.push('Lv' + t[0] + ' 称号=' + got + (got === t[1] ? '' : '（期望 ' + t[1] + '）'));
      if (got !== t[1]) bad++;
    });
    /* 进度条百分比：刚到升级线应为 0%，差一点应接近 100%
       （Lv2 区间是 3→8，跨度 5，所以 xp=3 是 0%、xp=5 是 40%、xp=7 是 80%） */
    var a = lv(3);      // 刚升到 Lv2
    var b = lv(7);      // 差 1 点升 Lv3
    LV.push('Lv2 起点 进度=' + Math.round(a.prog * 100) + '% 还需 ' + a.need + '（期望 0% / 5）');
    LV.push('Lv2 差一点 进度=' + Math.round(b.prog * 100) + '% 还需 ' + b.need + '（期望 80% / 1）');
    LV.push('满级 next=' + lv(9590).next + ' need=' + lv(9590).need + '（期望 null / 0）');
    LV.push('结论: ' + (bad === 0 ? 'PASS 曲线与阈值都对' : 'FAIL ' + bad + ' 处不符'));

/* ?probe=interact —— 验证手势语义：单击只摸不喂、拖到嘴边才喂、拖到别处不喂 */
if (new URLSearchParams(location.search).get('probe') === 'interact') {
  var IX = [];
  var P = window.RHODES_PET;
  var petNode = document.querySelector('.rp-pet');
  var handle = function () { return document.querySelector('.rp-offer'); };
  var pe = function () { return P.config.eatCount; };
  var pev = function (type, x, y, target) {
    var ev = new PointerEvent(type, {
      clientX: x, clientY: y, bubbles: true, cancelable: true,
      pointerId: 1, pointerType: 'mouse', isPrimary: true
    });
    (target || window).dispatchEvent(ev);
  };
  var pd = function (type, x, y) {
    petNode.dispatchEvent(new PointerEvent(type, {
      clientX: x, clientY: y, bubbles: true, cancelable: true, pointerId: 2, pointerType: 'mouse'
    }));
  };

  setTimeout(function () {
    var r = petNode.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;

    /* 1) 单击：只摸不喂（跑 6 次，随机喂食的话几乎必然触发） */
    var before = pe();
    for (var i = 0; i < 6; i++) {
      pd('pointerdown', cx, cy); pd('pointerup', cx, cy);
    }
    setTimeout(function () {
      var afterClick = pe();
      IX.push('单击 6 次：已吃 ' + before + '->' + afterClick +
        '（期望不变，证明不再随机喂）' + (afterClick === before ? ' OK' : ' 错!'));

      /* 2) 拖到嘴边松手：应该喂 */
      var h = handle();
      if (!h) { IX.push('把手不存在!'); document.title = 'IX|' + IX.join(' | '); return; }
      var hr = h.getBoundingClientRect();
      var before2 = pe();
      pev('pointerdown', hr.left + 22, hr.top + 22, h);
      pev('pointermove', cx, cy, h);
      pev('pointerup', cx, cy, h);
      setTimeout(function () {
        var afterDrop = pe();
        IX.push('拖到嘴边喂：' + before2 + '->' + afterDrop +
          (afterDrop === before2 + 1 ? ' OK' : ' 错!'));
        /* 吃完再试"拖到别处" */
        setTimeout(function () {
          for (var k = 0; k < 8; k++) P.biteOnce();
          var before3 = pe();
          var h2 = handle();
          var r2 = h2.getBoundingClientRect();
          pev('pointerdown', r2.left + 22, r2.top + 22, h2);
          pev('pointermove', 40, 40, h2);          // 拖到左上角，远离兔兔
          pev('pointerup', 40, 40, h2);
          setTimeout(function () {
            var afterMiss = pe();
            IX.push('拖到别处松手：' + before3 + '->' + afterMiss +
              (afterMiss === before3 ? ' OK 没喂' : ' 错! 不该喂'));
            var pass = afterClick === before && afterDrop === before2 + 1 && afterMiss === before3;
            IX.push('结论: ' + (pass ? 'PASS' : 'FAIL'));
            document.title = 'INTERACT|' + IX.join(' | ');
          }, 200);
        }, 1400);
      }, 200);
    }, 200);
  }, 220);
}

if (new URLSearchParams(location.search).get('probe') === 'supply') {

        eaten: P.config.eatCount, xp: P.config.xp };
    };
    var b = snap();

    for (var k = 0; k < 8; k++) P.biteOnce();
    var a = snap();
    SP.push('起始 今日=' + b.q + ' 库存=' + b.s + ' 可用=' + b.a);
    SP.push('feed() 返回=' + ok + '（期望 ' + expectFeed + '）');
    SP.push('吃一根后 今日=' + a.q + ' 库存=' + a.s + ' 可用=' + a.a);
    SP.push('累计 ' + b.eaten + '->' + a.eaten + ' / xp ' + b.xp + '->' + a.xp);

    var pass;
    if (expectFeed) {
      /* 能喂：可用 -1、累计 +1、xp +1。
         扣哪个池子要看起始状态：今日配额还有就先扣配额（库存不动），
         配额空了才扣存粮（今日不动）—— 断言必须跟着这个规则走，不能写死一种。 */
      var poolOk = b.q > 0
        ? (a.q === b.q - 1 && a.s === b.s)
        : (a.q === b.q && a.s === b.s - 1);
      pass = ok === true && a.a === b.a - 1 && poolOk &&
        a.eaten === b.eaten + 1 && a.xp === b.xp + 1;
    } else {
      pass = ok === false && a.a === b.a &&
        a.eaten === b.eaten && a.xp === b.xp;
    }
    SP.push('扣减来源: ' + (expectFeed
      ? ((b.q > 0 ? '今日配额' : '存粮') + ' -> ' + (poolOk ? '正确' : '错误'))
      : '（没喂成，不涉及扣减）'));

    /* 面板上**显示出来的**数字也要跟着动 —— 这正是不久前那个问题的核心：
       内部状态一直在动，但面板显示的是"含今日剩余的总量"，于是那个数纹丝不动，
       看起来像两个互不相干的池子。这里直接读 DOM 断言。 */
    var txt = function (id) {
      var n = document.querySelector('#' + id);
      return n ? n.textContent : 'MISSING';

    var dq = txt('rp-quota'), dt = txt('rp-total');
    SP.push('面板显示: 今日=' + dq + ' 共=' + dt + '（期望 今日=' + a.q + ' 共=' + a.a + '）');
    var domOk = dq === String(a.q) && dt === String(a.a) &&
      (expectFeed ? dt === String(b.a - 1) : dt === String(b.a));
    SP.push('面板数字: ' + (domOk ? '正确' : '错误（显示与状态不一致）'));
    pass = pass && domOk;

    SP.push('结论: ' + (pass ? 'PASS' : 'FAIL'));

       插件要等启动动画退场才创建引擎，等多久不确定（几十毫秒到 15s）。
       这里先把提醒的内容抓下来（气泡可能已经淡出，所以抓过就不再依赖 DOM）。 */
    var bubbleText = '';
    var seen = window.__CHECKIN_BUBBLES || [];
    if (seen.length) bubbleText = seen.join(' / ');
    C.push('8) 出场时弹出的签到提醒="' + (bubbleText || '(没抓到)') + '"');
    var bubbleOk = /签到完成/.test(bubbleText) && /\+50/.test(bubbleText) && /共/.test(bubbleText);

    var pass = firstOk && eatOk && rollOk && capOk && fullOk && legacyOk && dirtyOk && bubbleOk;
    C.push('结论: ' + (pass ? 'PASS' : 'FAIL ' + JSON.stringify({
      firstOk: firstOk, eatOk: eatOk, rollOk: rollOk, capOk: capOk,
      fullOk: fullOk, legacyOk: legacyOk, dirtyOk: dirtyOk, 出场提醒: bubbleOk
    })));
    document.title = 'CHECKINPROBE|' + C.join(' | ');
  }, 300);
}

/* ?probe=ui —— 两个可用性问题的实测：
   ① 拖拽喂食的把手在 DOM 里的位置（CSS 用的是 .rp-pet:hover .rp-offer，必须是后代才命中）
   ② 设置面板打开后，点击外部能不能关闭、点面板内部会不会误关 */
if (new URLSearchParams(location.search).get('probe') === 'ui') {
  var U = [];
  setTimeout(function () {
    var P = window.RHODES_PET;
    var pet = document.querySelector('.rp-pet');
    var offer = document.querySelector('.rp-offer');
    var panel = document.querySelector('.rp-panel');
    var gear = document.querySelector('.rp-gear');

    /* ① 把手结构：CSS 规则是 .rp-pet:hover .rp-offer（后代选择器） */
    U.push('把手在 pet 内=' + pet.contains(offer) +
      '（后代选择器要求 true，否则 hover 永不显示）');
    U.push('把手父元素=' + (offer.parentNode.className || offer.parentNode.tagName));
    /* 把手初始是否可见（opacity） */
    U.push('把手 opacity=' + getComputedStyle(offer).opacity + '（未悬停时应为 0）');

    /* ①b 硬证据：hover 规则**确实存在于样式表里**且没被浏览器丢弃。
       （headless 没法真的把鼠标悬上去触发 :hover，所以分两步验证：
         规则在 + 把手是它的后代 → 浏览器 hover 时必然匹配。） */
    var hoverRule = '';
    for (var si = 0; si < document.styleSheets.length; si++) {
      var rules;
      try { rules = document.styleSheets[si].cssRules; } catch (e) { continue; }
      for (var ri = 0; ri < rules.length; ri++) {
        var sel = rules[ri].selectorText || '';
        if (sel.indexOf('.rp-pet:hover') >= 0 && sel.indexOf('.rp-offer') >= 0) {
          hoverRule = sel + ' { ' + (rules[ri].style.cssText || '') + ' }';
        }
      }
    }
    U.push('悬停规则=' + (hoverRule || '未找到!'));
    /* 把手可见性确实受类名控制：加上 rp-out 后 opacity 应为 1。
       注意要先禁用过渡再读 —— .rp-offer 有 transition:opacity .2s，
       加完类立刻读 computed 会拿到过渡起始值（0），headless 又不推进过渡，
       会误判成"CSS 没生效"（这个坑踩过一次）。 */
    offer.style.transition = 'none';
    offer.classList.add('rp-out');
    var opForced = getComputedStyle(offer).opacity;
    offer.classList.remove('rp-out');
    offer.style.transition = '';
    U.push('加 rp-out 后 opacity=' + opForced + '（期望 1，证明 CSS 能控制它的可见性）');
    var cssOk = !!hoverRule && opForced === '1';

    /* ② 点外部关面板 */
    P.openPanel();
    U.push('打开面板 on=' + panel.classList.contains('on'));
    document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    var afterBody = panel.classList.contains('on');
    U.push('点 body 后 on=' + afterBody + '（期望 false）');

    /* ③ 点面板内部不该关 */
    P.openPanel();
    panel.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    var afterInside = panel.classList.contains('on');
    U.push('点面板内后 on=' + afterInside + '（期望 true）');

    /* ④ 点齿轮不该关（它是开关，自己会切） */
    P.openPanel();
    gear.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    var afterGear = panel.classList.contains('on');
    U.push('点齿轮后 on=' + afterGear + '（期望 true，齿轮自己才切）');

    /* ⑤ 点「喂一根」应：关掉面板 + 把把手强制显示出来 */
    P.openPanel();
    var feedBtn = panel.querySelector('#rp-act-feed');
    feedBtn.click();
    var afterFeedBtn = panel.classList.contains('on');
    var offerShown = offer.classList.contains('rp-out');
    U.push('点喂一根后 面板on=' + afterFeedBtn + '（期望 false）把手强显=' +
      offerShown + '（期望 true）');
    var feedOk = !afterFeedBtn && offerShown;

    var pass = pet.contains(offer) && cssOk && !afterBody && afterInside && afterGear && feedOk;
    U.push('结论: ' + (pass ? 'PASS' : 'FAIL'));
    document.title = 'UIPROBE|' + U.join(' | ');
  }, 600);
}

/* ?probe=sound —— 验证"抓取 / 放下"音效：真的发声、响的是对的那个、单击不误响。
   靠振荡器被设定的频率特征来认音效：
     抓取 = 640 上扬 + 1600 点缀    放下 = 760 下滑 + 240 低音    摸头 = 760 + 1520
   （240 是放下音独有的，用它区分"放下"和"摸头"——两者都有 760。） */
if (new URLSearchParams(location.search).get('probe') === 'sound') {
  var SD = [];
  setTimeout(function () {
    var A = window.__AUDIO;
    var pet = document.querySelector('.rp-pet');
    var P_sound = window.RHODES_PET;
    SD.push('AudioContext 创建=' + A.ctx + '（期望 >0）');
    var r = pet.getBoundingClientRect();
    var cx = Math.round(r.left + r.width / 2), cy = Math.round(r.top + r.height / 2);
    function soundEv(type, x, y) {
      pet.dispatchEvent(new PointerEvent(type, {
        bubbles: true, cancelable: true, clientX: x, clientY: y,
        pointerId: 7, isPrimary: true, button: 0, buttons: 1
      }));
    }
    function soundFreqs(from) {
      return A.freqs.slice(from).map(function (f) { return f.set.join('/'); });
    }
    function soundNear(list, target) {
      return list.some(function (s) {
        return s.split('/').some(function (v) {
          var n = parseFloat(v);
          return n > 0 && Math.abs(n - target) / target < 0.09;
        });
      });
    }

    /* ① 拖动 → 抓取音 */
    var n0 = A.freqs.length;
    soundEv('pointerdown', cx, cy);
    soundEv('pointermove', cx + 36, cy + 12);      // 位移 >4px → moved=true → Sfx.grab()
    var grab = soundFreqs(n0);
    var grabOk = soundNear(grab, 640) && soundNear(grab, 1600);
    SD.push('拖动发声 ' + grab.length + ' 组 [' + grab.join(' | ') + ']');
    SD.push('  抓到抓取音特征(640/1600)=' + grabOk);

    /* ② 松手 → 放下音 */
    var n1 = A.freqs.length;
    soundEv('pointerup', cx + 36, cy + 12);
    var put = soundFreqs(n1);
    var putOk = soundNear(put, 760) && soundNear(put, 240);
    SD.push('松手发声 ' + put.length + ' 组 [' + put.join(' | ') + ']');
    SD.push('  抓到放下音特征(760/240)=' + putOk);

    /* ③ 单击（没移动）不该响抓取音、也不该响放下音 */
    var n2 = A.freqs.length;
    soundEv('pointerdown', cx, cy);
    soundEv('pointerup', cx, cy);
    var tap = soundFreqs(n2);
    var tapOk = !soundNear(tap, 640) && !soundNear(tap, 240);
    SD.push('单击发声 ' + tap.length + ' 组 [' + tap.join(' | ') + ']');
    SD.push('  没误响抓取/放下音=' + tapOk);

    /* ④ 生气 / 躲起来哭 / 喂一根哄好：三个新音效都得认得出来。
       yip=520（被戳烦了）、sniff=880（吸鼻子）、sob=470；
       三个频率都是特意挑的 —— 不和 640/760/1520/1600/240 任何一个重合。 */
    var n3 = A.freqs.length;
    P_sound.angerEnter();                       // 生气那一瞬间：yip
    var yip = soundFreqs(n3);
    var yipOk = soundNear(yip, 520);
    SD.push('生气发声 ' + yip.length + ' 组 [' + yip.join(' | ') + '] 抓到 yip(520)=' + yipOk);

    var n4 = A.freqs.length;
    P_sound.angerHide();                        // 躲起来：sob(big) 470
    var hide = soundFreqs(n4);
    var hideOk = soundNear(hide, 470);
    /* 吸鼻子（sniff, 880）挂在 cryLoop 里每 140ms 一拍上，而它的节流用的是
       performance.now() —— 无头环境里那口钟几乎不走（虚拟时间只快进 setTimeout），
       所以"等一拍就一定听得到 880"是不成立的。这里改成**看哭的循环有没有挂上**：
       hide/sad 期间 sniffAt 必须是有限的（排了下一声吸鼻子），
       而且 calming 之后必须不再发声。 */
    var aCry = P_sound.anger();
    var sniffScheduled = (aCry.state === 'hide' || aCry.state === 'sad') &&
      isFinite(P_sound.state.anger.sniffAt) && isFinite(P_sound.state.anger.sobAt);
    SD.push('躲起来时 抽泣/吸鼻子已排程=' + sniffScheduled +
      '（state=' + aCry.state + ' sobAt=' + Math.round(P_sound.state.anger.sobAt) +
      ' sniffAt=' + Math.round(P_sound.state.anger.sniffAt) + '）');

    var n6 = A.freqs.length;
    P_sound.comfort();                          // 哄好（喂一根走的就是它）
    var after = soundFreqs(n6);
    var quietOk = P_sound.anger().state === 'calm' && !soundNear(after, 470) && !soundNear(after, 880);
    SD.push('哄好后 状态=' + P_sound.anger().state + ' 不再哭=' + quietOk +
      '（这几组频率 [' + after.join(' | ') + ']）');

    var all = A.ctx > 0 && grabOk && putOk && tapOk && yipOk && hideOk && sniffScheduled && quietOk;
    SD.push('结论: ' + (all ? 'PASS'
      : 'FAIL ' + JSON.stringify({ ctx: A.ctx, 抓取音: grabOk, 放下音: putOk, 单击不误响: tapOk,
        yip: yipOk, sob: hideOk, 哭泣循环: sniffScheduled, 哄好不哭: quietOk })));
    document.title = 'SOUNDPROBE|' + SD.join(' | ');
  }, 700);
}

/* ?probe=face —— 验证"拖胡萝卜流口水 / 吃完冒腮红"的**触发时机**（视觉位置靠截图看）
   腮红/口水都带 transition，读 computed 之前要先把过渡关掉，
   否则读到的是过渡起始值，会误判成"没生效"（这个坑踩过好几次）。 */
if (new URLSearchParams(location.search).get('probe') === 'face') {
  var FP = [];
  setTimeout(function () {
    var P = window.RHODES_PET;
    var pet = document.querySelector('.rp-pet');
    var offer = document.querySelector('.rp-offer');
    var blush = document.querySelector('.rp-blush');
    var drool = document.querySelector('.rp-drool');
    FP.push('元素存在: 腮红=' + !!blush + ' 口水=' + !!drool);

    blush.style.transition = 'none';
    drool.style.transition = 'none';
    var initBlush = getComputedStyle(blush).opacity;
    var initDrool = getComputedStyle(drool).opacity;
    FP.push('初始 opacity: 腮红=' + initBlush + ' 口水=' + initDrool + '（都应为 0）');
    var initOk = initBlush === '0' && initDrool === '0';

    function faceEv(type, x, y, node) {
      node.dispatchEvent(new PointerEvent(type, {
        bubbles: true, cancelable: true, clientX: x, clientY: y,
        pointerId: 11, isPrimary: true, button: 0, buttons: 1
      }));
    }

    /* ① 开始拖胡萝卜 → 嘴角挂口水 */
    var r = offer.getBoundingClientRect();
    faceEv('pointerdown', Math.round(r.left + 30), Math.round(r.top + 30), offer);
    var droolOn = pet.classList.contains('rp-drool-on');
    var droolOp = getComputedStyle(drool).opacity;
    FP.push('拖动中 口水 class=' + droolOn + ' opacity=' + droolOp + '（期望 true / 1）');

    /* ② 松手 → 口水收起 */
    faceEv('pointerup', Math.round(r.left + 30), Math.round(r.top + 30), offer);
    var droolOff = !pet.classList.contains('rp-drool-on');
    FP.push('松手后 口水已收起=' + droolOff + '（期望 true）');

    /* ③ 喂一根、等它啃完 → 脸颊冒腮红。
       用 MutationObserver 抓 class 变化：腮红只亮 2.6 秒就淡出，
       直接读最终状态可能已经错过了。 */
    var seenBlush = false;
    var mo = new MutationObserver(function () {
      if (pet.classList.contains('rp-blush-on')) seenBlush = true;
    });
    mo.observe(pet, { attributes: true, attributeFilter: ['class'] });

    P.feed();
    setTimeout(function () {
      FP.push('吃完后出现过腮红=' + seenBlush +
        '（此刻 class=' + pet.classList.contains('rp-blush-on') + '）');
      var pass = !!blush && !!drool && initOk && droolOn &&
        droolOp === '1' && droolOff && seenBlush;
      FP.push('结论: ' + (pass ? 'PASS' : 'FAIL ' + JSON.stringify({
        元素: !!blush && !!drool, 初始都隐藏: initOk,
        拖动出口水: droolOn, 口水可见: droolOp === '1',
        松手收起: droolOff, 吃完冒腮红: seenBlush
      })));
      document.title = 'FACEPROBE|' + FP.join(' | ');
    }, 2400);
  }, 500);
}

/* ?probe=nodebug —— 回归测试：**插件模式（debug:false）下不能动用户存档**。
   起因是一个真实 bug：DEBUG.fed 在插件模式下默认成 0（而不是 null），
   而消费它的那句是 `if (DEBUG.fed != null) cfg.eatCount = ...` —— 0 != null 成立，
   于是每次启动都把"已吃"清零（等级/好感/库存都正常，所以很久没被发现）。
   这个探针就用 debug:false 起一个引擎，看存档里的值有没有被改。 */
if (new URLSearchParams(location.search).get('probe') === 'nodebug') {
  var NB = [];
  setTimeout(function () {
    var KEY = 'dsh-rhodesPet.config';
    /* 摆一份"用户玩了一阵"的存档 */
    localStorage.setItem(KEY, JSON.stringify({
      size: 158, xp: 500, affection: 66, eatCount: 42
    }));

    /* 插件就是这么起引擎的：debug:false */
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
    document.body.appendChild(host);
    var p2 = window.RHODES_PET_ENGINE({
      container: host, debug: false, fadeIn: 0, landMs: 0, dropFrom: 0
    });

    var st = p2.config;
    NB.push('debug:false 起引擎后: eatCount=' + st.eatCount + '（期望 42）' +
      ' xp=' + st.xp + '（期望 500） aff=' + st.affection + '（期望 66）');

    var raw = {};
    try { raw = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { }
    NB.push('存回 localStorage 的: eatCount=' + raw.eatCount + '（期望 42）');

    var eatOk = st.eatCount === 42;
    var xpOk = st.xp === 500 && st.affection === 66;
    var diskOk = raw.eatCount === 42;
    var pass = eatOk && xpOk && diskOk;
    NB.push('结论: ' + (pass ? 'PASS' : 'FAIL ' + JSON.stringify({
      已吃没被清零: eatOk, 等级好感保留: xpOk, 存档没被改写: diskOk
    })));
    document.title = 'NODEBUGPROBE|' + NB.join(' | ');
  }, 400);
}

/* ?probe=paneldrag —— 验证设置面板"任意位置"能拖、控件上不能拖、位置会记住、双击能复位 */
if (new URLSearchParams(location.search).get('probe') === 'paneldrag') {
  var PD = [];
  setTimeout(function () {
    var P = window.RHODES_PET;
    /* 面板是懒构建的：必须**先打开**才会生成 DOM，然后才能查到元素 */
    P.openPanel();
    var panel = document.querySelector('.rp-panel');
    /* 面板打开时有一段 transform 过渡（.18s），过渡没走完时 getBoundingClientRect
       读到的是中间态，位移会算歪（实测差 6px/17px）。这里先把它掐掉再量。
       注意这只影响测量 —— 真实使用中那 0.18s 里没人能按下并拖动。 */
    panel.style.transition = 'none';

    function pevOn(node, type, x, y) {
      node.dispatchEvent(new PointerEvent(type, {
        bubbles: true, cancelable: true, clientX: x, clientY: y,
        pointerId: 21, isPrimary: true, button: 0, buttons: 1
      }));
    }
    function pos() {
      var r = panel.getBoundingClientRect();
      return { l: Math.round(r.left), t: Math.round(r.top) };
    }
    /* 从某个元素上按住拖 (dx,dy)，返回面板位移 */
    function dragFrom(node, dx, dy, id) {
      var p0 = pos();
      var r = node.getBoundingClientRect();
      var sx = Math.round(r.left + Math.min(6, r.width / 2));
      var sy = Math.round(r.top + Math.min(6, r.height / 2));
      node.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true, cancelable: true, clientX: sx, clientY: sy,
        pointerId: id, isPrimary: true, button: 0, buttons: 1
      }));
      panel.dispatchEvent(new PointerEvent('pointermove', {
        bubbles: true, cancelable: true, clientX: sx + dx, clientY: sy + dy,
        pointerId: id, isPrimary: true, button: 0, buttons: 1
      }));
      panel.dispatchEvent(new PointerEvent('pointerup', {
        bubbles: true, cancelable: true, clientX: sx + dx, clientY: sy + dy,
        pointerId: id, isPrimary: true, button: 0, buttons: 1
      }));
      var p1 = pos();
      return { dx: p1.l - p0.l, dy: p1.t - p0.t, p0: p0 };
    }

    var r0 = pos();
    PD.push('打开时位置=' + r0.l + ',' + r0.t);

    /* ① 状态区（不是控件）→ 应该能拖 */
    var stat = panel.querySelector('.rp-stat-top');
    var a = dragFrom(stat, 120, 80, 21);
    PD.push('①拖状态区 位移=' + a.dx + ',' + a.dy + '（期望 120,80）');
    var statOk = Math.abs(a.dx - 120) <= 2 && Math.abs(a.dy - 80) <= 2;

    /* ②③④ 控件上按下 → 面板**不该**动（否则滑块/开关/折叠标题就没法用了） */
    var ctrlOk = true;
    var ctrls = [
      ['滑块', panel.querySelector('input[type=range]')],
      ['开关', panel.querySelector('.rp-sw')],
      ['折叠标题', panel.querySelector('.rp-group-hd')]
    ];
    ctrls.forEach(function (c, i) {
      if (!c[1]) { PD.push('  找不到' + c[0] + '!'); ctrlOk = false; return; }
      var b = dragFrom(c[1], 90, 60, 31 + i);
      var still = b.dx === 0 && b.dy === 0;
      if (!still) ctrlOk = false;
      PD.push('  拖' + c[0] + ' 面板位移=' + b.dx + ',' + b.dy + '（期望 0,0）');
    });

    /* 位置有没有被记住 */
    var r1 = pos();
    var cx = P.config.panelX, cy = P.config.panelY;
    var remembered = Math.abs(cx - r1.l) <= 2 && Math.abs(cy - r1.t) <= 2;
    PD.push('记住的坐标=' + cx + ',' + cy + '（期望 ≈' + r1.l + ',' + r1.t + '）');

    /* 关掉再打开：位置不该被自动跟位覆盖 */
    P.closePanel();
    P.openPanel();
    var r2 = pos();
    var kept = Math.abs(r2.l - r1.l) <= 2 && Math.abs(r2.t - r1.t) <= 2;
    PD.push('关掉重开后=' + r2.l + ',' + r2.t + '（期望和拖后一致）');

    /* 在**非控件位置**双击 → 清掉记录，回到自动跟位 */
    var stat2 = panel.querySelector('.rp-stat-top');
    stat2.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, cancelable: true }));
    var r3 = pos();
    var cleared = P.config.panelX === null && P.config.panelY === null;
    var backAuto = Math.abs(r3.l - r1.l) > 2 || Math.abs(r3.t - r1.t) > 2;
    PD.push('双击后 记录已清=' + cleared + ' 位置已变=' + backAuto +
      '（现在=' + r3.l + ',' + r3.t + '）');

    var pass = statOk && ctrlOk && remembered && kept && cleared && backAuto;
    PD.push('结论: ' + (pass ? 'PASS' : 'FAIL ' + JSON.stringify({
      任意位置能拖: statOk, 控件上不拖: ctrlOk, 记住位置: remembered,
      重开保持: kept, 双击清记录: cleared, 回到自动位: backAuto
    })));
    document.title = 'PANELDRAGPROBE|' + PD.join(' | ');
  }, 600);
}

/* ?probe=facing —— 验证朝向**只在"抓取 → 放下"两个动作做完之后**才变：
     按住拖到左半边（手还按着）→ 必须**不**镜像；
     在那个位置松手、落地站稳之后 → 才镜像成"朝右面向中间"。拖回右半边同理。
   另外确认腮红/口水/胡萝卜都挂在 .rp-inner 里 —— 翻转加在 inner 上，
   它们才会跟着一起镜像（只翻图片的话，脸翻了腮红却留在原地）。 */
if (new URLSearchParams(location.search).get('probe') === 'facing') {
  var FA = [];
  setTimeout(function () {
    var pet = document.querySelector('.rp-pet');
    var flipEl = document.querySelector('.rp-flip');
    function mirrored() {
      /* 镜像挂在 .rp-flip（inner 的包装层）上 —— 这样翻转才能走 200ms 过渡，
         而 .rp-inner 的 transform 每帧都被呼吸/蹦跳重写，挂过渡会被一帧一帧重置。 */
      return /scaleX\(-1\)|matrix\(-1/.test(flipEl.style.transform || '');
    }
    function pev(type, x, y) {
      pet.dispatchEvent(new PointerEvent(type, {
        bubbles: true, cancelable: true, clientX: x, clientY: y,
        pointerId: 41, isPrimary: true, button: 0, buttons: 1
      }));
    }
    function petY() { return Math.round(pet.getBoundingClientRect().top + 30); }
    /* 按住并拖到目标 x —— **刻意不松手**，用来验"拖着的时候不转身" */
    function grabTo(targetX) {
      var r = pet.getBoundingClientRect();
      pev('pointerdown', Math.round(r.left + 30), petY());
      pev('pointermove', targetX, petY());
      return Math.round(pet.getBoundingClientRect().left);
    }
    /* 松手 = 放下。落地动画 240ms，所以等它站稳了再读朝向（读早了必然还是旧朝向） */
    function releaseAndWait(step) {
      pev('pointerup', 0, petY());      // 拖动过 → clientX 用不到（只有"没拖动"才走 touch）
      setTimeout(step, 500);
    }

    var vw = window.innerWidth, mid = Math.round(vw / 2);
    FA.push('屏幕中线 x=' + mid);
    FA.push('初始（右下角）镜像=' + mirrored() + '（期望 false：素材默认朝左）');
    var initOk = !mirrored();

    var inInner = ['.rp-blush', '.rp-drool', '#rpCarrot'].every(function (s) {
      return !!flipEl.querySelector(s);
    });
    FA.push('腮红/口水/胡萝卜都在翻转层内=' + inInner + '（才会一起镜像）');

    var lx = grabTo(60);
    var heldLeftOk = !mirrored();
    FA.push('拖到左侧 x=' + lx + ' **还没松手**镜像=' + mirrored() + '（期望 false：拖着不转身）');
    releaseAndWait(function () {
      var dropLeftOk = mirrored();
      FA.push('在左侧放下之后镜像=' + mirrored() + '（期望 true：朝右面向中间）');

      var rx = grabTo(vw - 140);
      var heldRightOk = mirrored();
      FA.push('拖回右侧 x=' + rx + ' **还没松手**镜像=' + mirrored() + '（期望 true：仍然没变）');
      releaseAndWait(function () {
        var dropRightOk = !mirrored();
        FA.push('在右侧放下之后镜像=' + mirrored() + '（期望 false：朝左面向中间）');

        /* 中线：判据是**兔兔自己的中心**，一过中线就翻（不再有 24px 迟滞）。
           抓取点是"兔兔左边 +30px"，所以要把它的**中心**放到中线左侧 10px，
           指针得落在 mid - 宽/2 + 20。 */
        var pw = pet.getBoundingClientRect().width;
        var cx = grabTo(mid - pw / 2 + 20);
        var heldMidOk = !mirrored();
        FA.push('中心在中线左 10px（未松手）x=' + cx + ' 镜像=' + mirrored() + '（期望 false：拖着不转）');
        releaseAndWait(function () {
          var midFlipOk = mirrored();
          FA.push('中心在中线左 10px 放下后镜像=' + mirrored() +
            '（期望 true：判据就是中心 vs 中线，一过线就翻）');
          var pass = initOk && inInner && heldLeftOk && heldRightOk && heldMidOk &&
            dropLeftOk && dropRightOk && midFlipOk;
          FA.push('结论: ' + (pass ? 'PASS' : 'FAIL ' + JSON.stringify({
            初始朝左: initOk, 部件都在inner: inInner, 拖着不转身: heldLeftOk && heldRightOk,
            左侧放下后镜像: dropLeftOk, 右侧放下后还原: dropRightOk, 过中线就翻: midFlipOk
          })));
          document.title = 'FACINGPROBE|' + FA.join(' | ');
        });
      });
    });
  }, 600);
}

/* ?probe=level —— 验证等级/好感机制：连喂直到升级，看数值、进度条、台词池 */
if (new URLSearchParams(location.search).get('probe') === 'level') {
  var K = [];
  var rdv = function (id) {
    var n = document.querySelector('#' + id);
    return n ? n.textContent : 'MISSING';
  };
  var barW = function (id) {
    var n = document.querySelector('#' + id);
    return n ? n.style.width : 'MISSING';
  };
  var stat = function (tag) {
    return tag + ' Lv=' + rdv('rp-lv') + ' 称号=' + rdv('rp-title') +
      ' xp条=' + barW('rp-xp-bar') + ' 好感=' + rdv('rp-aff-val') +
      ' 好感条=' + barW('rp-aff-bar') + ' 阶段=' + rdv('rp-aff-tier');
  };
  /* 一根一根吃：feed 之后用 biteOnce 把整根啃完，否则 S.eat 会挡住下一根 */
  var gorge = function (n, done) {
    var i = 0;
    var one = function () {
      if (i >= n) { done(); return; }
      i++;
      window.RHODES_PET.feed();
      for (var k = 0; k < 8; k++) window.RHODES_PET.biteOnce();
      setTimeout(one, 40);
    };
    one();
  };
  window.addEventListener('rhodes-pet:levelup', function (e) {
    window.__lvlEvent = (window.__lvlEvent ? window.__lvlEvent + ' / ' : '') +
      'Lv' + e.detail.level + ' ' + e.detail.title + '(xp=' + e.detail.xp + ')';
  });
  setTimeout(function () {
    K.push('0) 初始 ' + stat('|'));
    gorge(3, function () {
      K.push('1) 吃满 3 根 ' + stat('|'));
      gorge(5, function () {
        K.push('2) 共 8 根 ' + stat('|'));
        window.RHODES_PET.touch();
        window.RHODES_PET.talk();
        setTimeout(function () {
          K.push('3) 摸+说话后 affection=' + window.RHODES_PET.config.affection);
          K.push('4) 升级事件=' + (window.__lvlEvent || '没触发'));
          document.title = 'LEVELPROBE|' + K.join(' | ');
        }, 320);
      });
    });
  }, 150);
}

/* ?probe=anger —— 验证"戳到阈值会生气，1 秒后躲到屏幕边上哭"。
   ============================================================================
   两个测试手段是必须的，缺一个都验不出来：

   ① **不能靠速率戳。** 计数带 1.6 秒的回落窗口（ANGER_COOL），
      合成事件在同一个 tick 里连发 N-1 次的话，第 N-1 次的 poke() 会看到
      `now - last >= 1600`，于是每次都先减 1 再加 1 —— 计数永远停在 1，
      根本到不了阈值。所以"到量会生气"这条走**只剩一下贴脸测试**：
      把计数器摆成 `angerThreshold - 1`，再戳真的一下，看它有没有炸。
      "戳了会不会计数"则由一次真戳 + 读 count 来验。
      ⚠ 阈值一律读 `P.angerThreshold`、不写死数字：阈值从 50 改到 30 之后，
        写死 49 的探针会永远停在"摆成 49、戳一下才 50"的假失败上。

   ② **无头环境要压缩计时。** 真实时长加起来 7.2 秒
      （生气 1 秒 + 躲边 3.2 秒 + 委屈 3 秒），探针等不起也用不上。
      所以用 ?angerMs=0.12 把三段一起缩短，再靠等更长的时间点去采样。
      ⚠ 采样点也得按压缩比算：ANG_HIDE 真实 3200ms，压缩后约 384ms，
        探针必须等 ~1.2 秒（≈ ANG_HIDE 的 3 倍）才敢断言"已经挪回来了"。
   ============================================================================ */
if (new URLSearchParams(location.search).get('probe') === 'anger') {
  var AG = [];
  setTimeout(function () {
    var P = window.RHODES_PET;
    var pet = document.querySelector('.rp-pet');
    var petBox = function () { return pet.getBoundingClientRect(); };
    var tears = document.querySelectorAll('.rp-tear');
    var css = function (sel, prop) { return getComputedStyle(document.querySelector(sel))[prop]; };
    var ang = function () { return P.anger(); };
    AG.push('x) 可见性：opacity=' + getComputedStyle(pet).opacity + ' 内联 transform=' +
      (pet.style.transform || '(空)').slice(0, 46) + ' 视口=' + window.innerWidth + 'x' + window.innerHeight);

    /* 0) 眼泪是画出来的：**一条**，正对那只可见的眼睛 */
    var svgPaths = 0;
    for (var t = 0; t < tears.length; t++) svgPaths += tears[t].querySelectorAll('svg path').length;
    var tl = tears[0] ? tears[0].getBoundingClientRect() : null;
    AG.push('0) 眼泪元素=' + tears.length + '（含 path ' + svgPaths / Math.max(1, tears.length) +
      ' 条）left=' + css('.rp-tear', 'left').replace(/px$/, ''));
    /* 只该有一条：多画一条就是"两行眼泪"，少一条就是没眼泪 */
    var tearsDrawn = tears.length === 1 && svgPaths === 1;
    /* 这一条必须**对准那只可见的眼睛**（素材 332×305 量出来：眼睛 ≈ (50%,21%)，
       瞳孔横跨 48%~52%），不能飘到鼻子/脸颊/耳朵上（真飘过两次：一次挂耳朵上、
       一次挂嘴角上 —— 都是把"鼻子"的坐标当成"眼睛"用了）。
       判据两条：
         · 横向：元素中心落在眼睛中心 5% 以内（泪珠固定在元素水平中点，
           所以元素中心就是泪珠的横向位置）；
         · 纵向：泪珠中心落在下眼睑（23%）附近 ±6% —— 太靠上压在瞳孔中间、
           太靠下就跑到腮帮子上了。泪珠在 SVG 里是 17/160 处，元素高 42%，
           所以泪珠中心 = 元素上沿 + 0.106 × 元素高。 */
    var petBox2 = petBox();
    var petW = petBox2.width, petL = petBox2.left, petH = petBox2.height;
    var tMid = tl ? (tl.left + tl.width / 2 - petL) / petW : NaN;
    var EYE_X = 0.50, EYE_LID_Y = 0.23;
    var tearsApart = Math.abs(tMid - EYE_X) < 0.05;
    var dropY = (parseFloat(css('.rp-tear', 'top')) +
      0.106 * parseFloat(css('.rp-tear', 'height'))) / petH;
    var tearsAtEye = Math.abs(dropY - EYE_LID_Y) < 0.06;
    AG.push('0b) 眼泪对准眼睛=' + (tearsApart && tearsAtEye) + '（泪痕中心 ' +
      Math.round(tMid * 100) + '% · 泪珠中心纵向 ' + Math.round(dropY * 100) +
      '% · 量出来的眼睛 (50%, 21%)、下眼睑 23%）');

    /* 1) 真戳一下：计数 +1（用 state 读，不信 DOM）。
       先 reset —— 这条路径得从"没生气"开始，否则 poke() 会因为 state 不是 calm 直接返回。 */
    P.comfort();
    var n0 = ang().n;
    var pev = function (type, x, y) {
      pet.dispatchEvent(new PointerEvent(type, {
        clientX: Math.round(x), clientY: Math.round(y), bubbles: true, cancelable: true,
        pointerId: 7, pointerType: 'mouse', isPrimary: true, button: 0
      }));
    };
    var r = petBox();
    pev('pointerdown', r.left + r.width / 2, r.top + r.height / 2);
    pev('pointerup', r.left + r.width / 2, r.top + r.height / 2);
    var n1 = ang().n;
    AG.push('1) 戳一下：计数 ' + n0 + '->' + n1 + (n1 === n0 + 1 ? ' OK' : ' 错!'));
    var tapCounts = n1 === n0 + 1;

    /* 2) 到量才炸：摆成"差一下"，戳最后这一下 —— 应当立刻进入 angry（眼泪 + 飞机耳） */
    var need = P.angerThreshold;
    P.state.anger.n = need - 1;
    pev('pointerdown', r.left + r.width / 2, r.top + r.height / 2);
    pev('pointerup', r.left + r.width / 2, r.top + r.height / 2);
    var a50 = ang();
    /* ⚠ 这里**不能用 `tearOp === '1'` 当判据**：入场动画（rp-tearin .22s）刚起步，
       任何"立刻读"都会读到 0 或中间值 —— 那条路只能证明 CSS 规则在，证明不了别的。
       所以分成两条：
         · tearOp / sweep：CSS 规则与"在淌"的动画挂上了没有（此处只做记录）
         · maxTearOp：整段时间里见过的**最大**计算 opacity（见下面的轮询），
           这才是"用户真的看得见"的证据，判断放在最后的 5b/结论里。 */
    var tg = document.querySelector('.rp-tear');
    var tgTr = tg.style.transition;
    tg.style.transition = 'none';
    var tearOp = getComputedStyle(tg).opacity;
    tg.style.transition = tgTr;
    var tearOpNow = parseFloat(getComputedStyle(tears[0]).opacity);
    var sweep = tg.querySelector('svg').getAnimations ? tg.querySelector('svg').getAnimations().length : -1;
    var angryNow = a50.state === 'angry' && a50.tears && sweep > 0;
    /* 2b) 生气那一秒的**整套表情**挂上了没有。
       这里不看 opacity，而是看 `.rp-img` 的 filter —— 它没有过渡，
       读到的就是当下真值，不会被"过渡没推进"骗过去。
       （曾经整套规则写成 .rp-anger、而引擎加的是 .rp-angry，于是撇嘴/脸红/发抖
         全是死的；眼泪那条因为同时列了两个类才活着，自检当年就是被这个骗过去的。） */
    var imgEl = pet.querySelector('.rp-img');
    var faceOn = String(getComputedStyle(imgEl).filter).indexOf('saturate') >= 0;
    var shiver = imgEl.getAnimations ? imgEl.getAnimations().length : -1;
    angryNow = angryNow && faceOn;
    AG.push('2b) 生气表情挂上=' + faceOn + '（filter 里有 saturate）发抖动画数=' + shiver +
      (faceOn ? ' OK' : ' 错!'));
    /* "用户真的看得见"这条**不能单点采样**：戳满的这一瞬间过渡才刚起步，
       读到的必然是 0（淡入要 0.22s）。所以从这里开始轮询记录**最大**计算 opacity，
       一直记到最后出结论 —— 期间只要有一刻 > .5，就说明它真的显示出来了。 */
    var maxTearOp = tearOpNow;
    var tearPoll = setInterval(function () {
      var v = parseFloat(getComputedStyle(tears[0]).opacity);
      if (v > maxTearOp) maxTearOp = v;
    }, 30);
    AG.push('2) 第 ' + need + ' 下：state=' + a50.state + ' 眼泪 opacity=' + tearOp +
      ' 扫过动画=' + sweep + ' 飞机耳=' + a50.earsDown + (angryNow ? ' OK' : ' 错!'));

    /* 3) 接下来是"躲到屏幕边"。
       这里**用 angerHide() 显式推进**，而不是干等 ANG_ANGRY 那条定时器：
       压缩计时（?angerMs=0.12）下整段情绪只有 ~0.86s，而无头环境的虚拟时钟会把
       定时器成批快进 —— 轮询常常一步跨过整个 'hide' 窗口，读到的已经是 'calm'，
       于是"没贴到边""点不到=false"全是假失败（这一版之前就一直这么 FAIL）。
       `angerHide()` 是引擎留给自检的同步入口（README 里有），用它把状态摆到
       "刚躲好"，剩下的"挪到位"仍然靠轮询等真实布局。 */
    P.angerHide();
    var waitFor = function (fn, limit, done) {
      var t0 = Date.now();
      (function poll() {
        if (fn() || Date.now() - t0 > limit) { done(); return; }
        setTimeout(poll, 16);
      })();
    };
    /* 等到"已经躲好、而且挪的动作停了"（angSlide 结束后 S.anger.slideT 不再被重排） */
    waitFor(function () {
      var a = ang();
      return a.state === 'hide' && !P.state.anger.slideT;
    }, 4000, function () {
      var ah = ang();
      /* ⚠ 位置的断言**只能用引擎自己的坐标**，不能用 getBoundingClientRect 和 window.innerWidth。
         实测这个无头环境里 rect 和 innerWidth 不是一个坐标系：
         一个 left:800px 的普通盒子 rect 也是 800（对得上），
         但带 transform:translate3d(1228px,…) scale(1.6) 的盒子 rect.left 报 1183
         —— 而按 CSS 规则应当是 1228 - 0.6×75 = 1183 才对（差 285）。
         也就是说 rect 被浏览器内部的一次布局缩放动了，拿它比 innerWidth 会得出
         "可见宽 150/150、贴边 +365px"这种完全不成立的数（第一版就误判成 FAIL）。
         引擎自己的 S.x / S.W 始终是 CSS 像素，和 layout() 用的 innerWidth 同一坐标系，
         所以这里直接读 pet 的内联 transform（放不放进视口是**布局**的事，
         引擎算出来的位置就是真实位置 —— 视觉效果交给截图去确认）。 */
      var ge = (function () {
        var m = /translate3d\((-?[\d.]+)px,\s*(-?[\d.]+)px/.exec(pet.style.transform || '');
        return m ? { x: +m[1], y: +m[2], w: ah.w } : { x: NaN, y: NaN, w: ah.w };
      })();
      var leftSide = (ge.x + ge.w / 2) <= window.innerWidth / 2;
      var out = leftSide ? -ge.x : (ge.x + ge.w - window.innerWidth);   // 探出视口多少
      var vis = ge.w - out;                                            // 还剩多少可见
      /* 判据：确实探出去一块（"躲起来"），但脸还留着（"在看你"）。
         两头都要卡住 —— 只判"探出去了"会放过"整只都飞出屏幕"，
         只看"还剩一点"会放过"只是挪到边上、根本没躲"。
         另外那只可见的眼睛在素材的 46% 处，所以露出比例必须明显大于 46%，
         否则连眼睛都被裁掉、眼泪就成了无源之水（这一条是拿着截图量出来的）。 */
      var nearEdge = out > ge.w * 0.2 && out < ge.w * 0.7 && vis > ge.w * 0.5;
      AG.push('3) 躲边：state=' + ah.state + ' x=' + Math.round(ge.x) +
        ' 贴' + (leftSide ? '左' : '右') + '边：探出=' + Math.round(out) + 'px 可见宽=' +
        Math.round(vis) + '/' + Math.round(ge.w) + ' 点不到=' + ah.clicked +
        ' [视口 ' + window.innerWidth + ' · 内联 transform=' + (pet.style.transform || '').slice(0, 44) + ']' +
        (nearEdge && ah.clicked && ah.state === 'hide' ? ' OK' : ' 错!'));
      var hidOk = nearEdge && ah.clicked && ah.state === 'hide';

      /* 4) 哭完自己挪回来、恢复原状。
         ⚠ 这里**不能只等固定的 1200ms**：压缩计时下 ANG_HIDE 只有 384ms，
           但定时器是被虚拟时间快进的、而"挪回来"那串帧是真实时间推进的 ——
           两者不同步（无头环境的时钟有两个）。所以等的是**状态**：轮询到 calm 为止。 */
      waitFor(function () { return ang().state === 'calm'; }, 6000, function () {
        var af = ang();
        var backX = Math.abs(af.x - ah.home.x) < 2;
        var recovered = af.state === 'calm' && !af.tears && !af.earsDown && backX &&
          getComputedStyle(pet).pointerEvents !== 'none';
        AG.push('4) 恢复：state=' + af.state + ' x=' + Math.round(af.x) + '（躲前 ' +
          Math.round(ah.home.x) + '）眼泪=' + af.tears + ' 飞机耳=' + af.earsDown +
          (recovered ? ' OK' : ' 错!'));

        /* 5) 喂一根就哄好：再惹它一次，喂食 → 立刻 calm */
        P.state.anger.n = P.angerThreshold - 1;
        var bf = petBox();
        pev('pointerdown', bf.left + bf.width / 2, bf.top + bf.height / 2);
        var a5 = ang();
        P.feed();
        var a6 = ang();
        AG.push('5) 哄好：惹毛后 state=' + a5.state + ' → 喂一根后 state=' + a6.state +
          (a6.state === 'calm' ? ' OK' : ' 错!'));

        /* 收尾：停掉眼泪轮询，用"整段时间里见过的最大可见度"下判断 */
        clearInterval(tearPoll);
        var tearsSeen = maxTearOp > 0.5;
        AG.push('5b) 眼泪最大可见度=' + maxTearOp.toFixed(2) + ' → 真的看得见=' + tearsSeen);
        var pass = tearsDrawn && tearsApart && tearsAtEye && tearsSeen && tapCounts && angryNow &&
          hidOk && recovered && a6.state === 'calm';
        AG.push('结论: ' + (pass ? 'PASS' : 'FAIL ' + JSON.stringify({
          画了眼泪: tearsDrawn, 眼泪对准眼睛: tearsApart && tearsAtEye, 眼泪看得见: tearsSeen,
          戳了会计数: tapCounts,
          到量生气: angryNow, 躲到边上: hidOk, 哭完恢复: recovered, 喂食哄好: a6.state === 'calm'
        })));
        document.title = 'ANGERPROBE|' + AG.join(' | ');
      });
    });
  }, 200);
}
</script>
</body>
</html>
